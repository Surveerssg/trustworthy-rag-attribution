# Main cross-domain run, small local generator (fits fully in 2GB VRAM, ~13s/query).
name: main_qwen1.5b
domains: [squad2, hotpotqa, pubmedqa, cuad, financebench]
systems: [trust_rag, vanilla_rag, oracle_trust, removed_trust, closed_book, oracle_vanilla, removed_vanilla]   # priority order
limit: null          # full prepared sets: hotpot 200, pubmed 200, cuad 200+100 unans, finbench 150, squad2 250+250
seed: 0
k: 5
chunk_words: 180
embed_model: sentence-transformers/all-MiniLM-L6-v2
llm: {backend: ollama, model: "qwen2.5:1.5b", max_tokens: 200, num_ctx: 4096}
workers: 4          # T4: Ollama serves 4 requests in parallel (OLLAMA_NUM_PARALLEL=4)
