# Kaggle (T4) run. Uses precomputed retrieval plans (data/plans) => byte-identical contexts to every other generator.
name: main_llama8b
domains: [squad2, hotpotqa, pubmedqa, cuad, financebench]
systems: [trust_rag, vanilla_rag, closed_book, removed_trust, removed_vanilla, oracle_trust, oracle_vanilla]
use_plans: true
limit: null
seed: 0
k: 5
chunk_words: 180
embed_model: sentence-transformers/all-MiniLM-L6-v2
llm: {backend: ollama, model: "llama3.1:8b", max_tokens: 200, num_ctx: 4096, base_url: "http://localhost:11435"}
workers: 4
