# Part G (Kaggle): second medical dataset, BioASQ (200 questions, sentence-level expert snippets as gold), model gemma3:27b.
# Pre-registered analysis: paper/findings/analysis_plan_bioasq.md. Contexts: data/plans/bioasq.jsonl (python -m scripts.prepare_bioasq).
name: bq_gemma27b
domains: [bioasq]
systems: [oracle_vanilla, vanilla_rag, removed_trust, trust_rag]   # priority order: attribution, retrieval loss, then the refusal pair
use_plans: true
limit: null
seed: 0
k: 5
chunk_words: 180
embed_model: sentence-transformers/all-MiniLM-L6-v2
llm: {backend: ollama, model: "gemma3:27b", max_tokens: 200, num_ctx: 4096, base_url: "http://localhost:11434", logprobs: true}
workers: 3
